# ============================================================================
# Celebrai Web — configuração do Nginx
#
# Responsabilidades:
#  - servir o SPA com fallback de rotas (React Router no refresh);
#  - cachear assets com hash por 1 ano e não cachear o HTML;
#  - comprimir respostas;
#  - aplicar headers de segurança (HTTPS termina no proxy à frente);
#  - repassar os headers de IP real para a API.
# ============================================================================

# Compressão — reduz o bundle (JS/CSS/JSON).
gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_comp_level 6;
gzip_types
  text/plain
  text/css
  text/javascript
  application/javascript
  application/json
  application/xml
  image/svg+xml
  font/woff2;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Tamanho máximo do corpo (importação de CSV).
    client_max_body_size 6m;

    # -----------------------------------------------------------------------
    # Headers de segurança
    # -----------------------------------------------------------------------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(self)" always;

    # Observação: a câmera é usada pelo scanner de check-in, por isso
    # `camera=(self)` em vez de bloqueio total.

    # -----------------------------------------------------------------------
    # Assets com hash no nome: cache imutável de 1 ano
    # -----------------------------------------------------------------------
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location ~* \.(?:woff2?|ttf|otf|eot|png|jpe?g|gif|webp|svg|ico)$ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # -----------------------------------------------------------------------
    # API — encaminha para o serviço `api` (nome do serviço no docker-compose)
    # -----------------------------------------------------------------------
    location /api/ {
        proxy_pass http://api:3333;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # Check-in precisa de resposta rápida e sem buffer.
        proxy_buffering off;
        proxy_read_timeout 60s;
    }

    # -----------------------------------------------------------------------
    # SPA fallback — qualquer rota desconhecida devolve o index.html
    # -----------------------------------------------------------------------
    location / {
        # O HTML nunca é cacheado: garante que o usuário pegue a versão nova
        # do bundle após um deploy.
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri $uri/ /index.html;
    }

    # Não expõe a versão do Nginx.
    server_tokens off;
}
